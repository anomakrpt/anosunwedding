<body>

  <header class="topbar">

    <div class="header-space"></div>

    <div class="brand">

      <img
        src="pic/logo.png"
        alt="Ausamah & Mizahasan Logo"
        class="brand-logo"
      >

      <h1 lang="en">AUSAMAH &amp; MIZAHASAN</h1>
    </div>

    <div class="header-space"></div>

  </header>


  <main class="rsvp-page">

    <!-- =========================================================
         HEADING
    ========================================================== -->

    <section class="rsvp-heading">

      <img
        src="pic/icon-bow.png"
        alt=""
        class="bow-icon"
      >

      <h2 lang="en">WILL YOU JOIN US?</h2>

      <p>ร่วมยืนยันการเข้าร่วมงานของคุณ</p>

      <p class="rsvp-date">16 – 17 มกราคม 2570 · ดอยหลวงเชียงดาว</p>

    </section>


    <!-- =========================================================
         FORM
    ========================================================== -->

    <section class="rsvp-section">

      <form id="rsvpForm" class="rsvp-form" novalidate>

        <div class="field">
          <label for="rsvpName">ชื่อ-นามสกุล</label>
          <input
            type="text"
            id="rsvpName"
            name="fullname"
            maxlength="80"
            placeholder="ชื่อของคุณ"
            autocomplete="name"
            required
          >
        </div>


        <fieldset class="field choice-field">
          <legend>ท่านสะดวกเข้าร่วมงานหรือไม่</legend>

          <div class="choice-row">

            <label class="choice-card">
              <input type="radio" name="attending" value="yes" required>
              <span class="choice-inner">
                <!-- กรอบว่าง -> ติ๊กถูก เมื่อถูกเลือก
                     รูปทรงเปลี่ยนจริง ไม่ได้บอกสถานะด้วยสีอย่างเดียว -->
                <span class="choice-mark" aria-hidden="true"></span>
                ยินดีเข้าร่วม
              </span>
            </label>

            <label class="choice-card">
              <input type="radio" name="attending" value="no" required>
              <span class="choice-inner">
                <span class="choice-mark" aria-hidden="true"></span>
                ขออภัย ไม่สามารถมาได้
              </span>
            </label>

          </div>
        </fieldset>


        <!-- แสดงเฉพาะเมื่อเลือก "ยินดีเข้าร่วม" -->
        <div class="field guests-field" id="guestsField" hidden>
          <label for="rsvpGuests">จำนวนผู้ติดตาม (ไม่รวมตัวท่าน)</label>

          <div class="stepper">
            <button type="button" class="step-btn" id="guestMinus" aria-label="ลดจำนวน">−</button>
            <output id="rsvpGuests" for="guestMinus guestPlus">0</output>
            <button type="button" class="step-btn" id="guestPlus" aria-label="เพิ่มจำนวน">+</button>
          </div>
        </div>


        <fieldset class="field choice-field" id="sideField" hidden>
          <legend>ท่านเป็นแขกฝั่งไหน (ไม่บังคับ)</legend>

          <div class="choice-row side-row">

            <label class="choice-card">
              <input type="radio" name="side" value="groom">
              <span class="choice-inner">
                <span class="choice-mark" aria-hidden="true"></span>
                ฝั่งเจ้าบ่าว
              </span>
            </label>

            <label class="choice-card">
              <input type="radio" name="side" value="bride">
              <span class="choice-inner">
                <span class="choice-mark" aria-hidden="true"></span>
                ฝั่งเจ้าสาว
              </span>
            </label>

          </div>
        </fieldset>


        <button type="submit" id="rsvpSubmit" class="submit-btn">
          ➤ &nbsp; ส่งคำตอบรับ
        </button>

        <div
          id="rsvpMessage"
          class="message"
          role="status"
          aria-live="polite"
        ></div>

      </form>

    </section>


    <!-- =========================================================
         CONFIRMATION CARD (แสดงหลังส่งสำเร็จ)
    ========================================================== -->

    <section class="rsvp-confirm" id="rsvpConfirm" hidden>

      <div class="confirm-card" id="confirmCard">

        <img
          src="pic/logo.png"
          alt=""
          class="confirm-logo"
        >

        <p class="confirm-brand" lang="en">AUSAMAH &amp; MIZAHASAN</p>

        <div class="confirm-divider">
          <img src="pic/icon-bow.png" alt="" class="bow-icon small">
        </div>

        <p class="confirm-title" id="confirmTitle" tabindex="-1">ขอบคุณสำหรับการตอบรับ</p>

        <p class="confirm-name" id="confirmName"></p>

        <p class="confirm-status" id="confirmStatus"></p>

        <div class="confirm-details">
          <p>16 – 17 มกราคม 2570</p>
          <p>ดอยหลวงเชียงดาว · เชียงใหม่</p>
        </div>

        <p class="confirm-note" id="confirmNote"></p>

      </div>


      <div class="confirm-actions">

        <button type="button" id="saveCardBtn" class="submit-btn">
          ↓ &nbsp; บันทึกการ์ด
        </button>

        <button type="button" id="shareCardBtn" class="submit-btn ghost">
          ➦ &nbsp; แชร์
        </button>

        <button type="button" id="calendarBtn" class="submit-btn ghost">
          🗓 &nbsp; เพิ่มลงปฏิทิน
        </button>

      </div>

      <button type="button" id="editRsvpBtn" class="edit-link">
        แก้ไขคำตอบ
      </button>

    </section>

  </main>

<a
