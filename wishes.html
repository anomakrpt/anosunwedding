<body>

  <header class="topbar">

    <!-- ฝั่งซ้ายเว้นว่าง เพราะใช้ Bottom Navigation ด้านล่างแทน -->
    <div class="header-space"></div>

    <div class="brand">

      <!--
        =====================================================
        LOGO PNG
        =====================================================
        ใส่ไฟล์โลโก้ไว้ที่:
        pic/logo.png

        ถ้าชื่อไฟล์ไม่ใช่ logo.png ให้แก้ src ด้านล่าง
      -->
      <img
        src="pic/logo.png"
        alt="Ausamah & Mizahasan Logo"
        class="brand-logo"
      >

      <h1>AUSAMAH &amp; MIZAHASAN</h1>
      <!-- <p>17-01-2027</p> -->
    </div>

    <!--<button
      class="music-btn"
      id="musicBtn"
      type="button"
      aria-label="Toggle music"
    >
      ♫
    </button> -->

  </header>


  <main>

    <section class="form-section">

      <!--
        ไอคอนโบว์ PNG
        ใส่ไฟล์ไว้ที่:
        pic/bow-icon.png
      -->
      <img
        src="pic/icon-wish.png"
        alt=""
        class="wish-icon"
      >

      <h2 class="section-title">
        LEAVE US YOUR WISHES
      </h2>

      <p class="section-subtitle">
        ฝากคำอวยพรถึงเรา 
      </p><br>

      <!--<div class="heart">
        ♥
      </div> -->


      <!--
        =========================================================
        WISH FORM

        JavaScript ของฟอร์มนี้อยู่ในไฟล์:
        assets/js/wishes.js

        ไม่ต้องใส่ API URL หรือ JavaScript ซ้ำใน wishes.html
        =========================================================
      -->

      <form
        id="wishForm"
        class="wish-form"
      >


        <div class="field">
           <img
        src="pic/icon-bow.png"
        alt=""
        class="bow-icon"
      >
          <label
            class="field-label"
            for="name"
          >
            YOUR NAME
          </label>

          <input
            id="name"
            name="name"
            type="text"
            maxlength="60"
            placeholder="ชื่อของคุณ"
            required
          >

        </div>


        <div class="field">

          <label
            class="field-label"
            for="wish"
          >
            YOUR WISHES
          </label>

          <textarea
            id="wish"
            name="wish"
            maxlength="200"
            placeholder="เขียนคำอวยพรของคุณที่นี่..."
            required
          ></textarea>

          <div class="counter">
            <span id="count">0</span>/200
          </div>

        </div>


        <label class="consent-row">

          <input
            id="allowDisplay"
            name="allowDisplay"
            type="checkbox"
          >

          <span>
            อนุญาตให้แสดงคำอวยพรของคุณบนเว็บไซต์
          </span>

        </label>


        <div class="divider">

          <img
            src="pic/icon-bow.png"
            alt=""
            class="bow-icon small"
          >

        </div>


        <button
          id="submitBtn"
          class="submit-btn"
          type="submit"
        >
          ➤ &nbsp; ส่งคำอวยพร
        </button>


        <div
          id="formMessage"
          class="message"
          aria-live="polite"
        ></div>

      </form>

    </section>


    <!-- =========================================================
         WISH TREE

         คำอวยพรแต่ละข้อ = หัวใจ 1 ดวงบนกิ่งไม้
         (อ้างอิงบอร์ดต้นไม้อวยพรในงานแต่งจริง)
         ยิ่งมีคนอวยพรมาก ต้นไม้ยิ่งเต็มไปด้วยหัวใจ
         แตะที่หัวใจเพื่ออ่านคำอวยพร — กดเต็มจอเพื่อฉายในงาน
    ========================================================== -->

    <section
      class="tree-section"
      id="treeSection"
    >

      <div class="cloud-header">

        <div class="sparkle-icon">
          ✦
        </div>

        <h2>
          WISHES FROM OUR LOVED ONES
        </h2>

        <p>
          คำอวยพรจากทุกคน
        </p>

      </div>


      <!-- เวทีต้นไม้ — เป็นตัวที่ขยายเต็มจอ -->
      <div
        class="tree-stage"
        id="treeStage"
      >

        <!-- กิ่งก้านสร้างจาก JS (assets/js/wishes.js → buildTree)
             หัวใจจะไปเกาะที่ปลายกิ่งแต่ละกิ่ง -->
        <svg
          class="wish-tree"
          id="wishTree"
          viewBox="0 0 1000 720"
          preserveAspectRatio="xMidYMax meet"
          aria-hidden="true"
        >

          <g class="tree-branches" id="treeBranches"></g>

          <g class="tree-hearts" id="treeHearts"></g>

          <ellipse
            class="tree-ground"
            cx="500"
            cy="706"
            rx="150"
            ry="9"
          />

        </svg>


        <!-- ป้ายนับ + ปุ่มเต็มจอ -->
        <div class="tree-hud">

          <span
            class="tree-count"
            id="treeCount"
          ></span>

          <button
            id="fullscreenBtn"
            class="tree-fs-btn"
            type="button"
            aria-label="แสดงเต็มจอ"
          >

            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
            </svg>

            <span class="tree-fs-label">เต็มจอ</span>

          </button>

        </div>


        <!-- คำอวยพรที่กำลังฉาย -->
        <div
          class="wish-spotlight"
          id="wishSpotlight"
          aria-live="polite"
        >

          <p class="wish-spotlight-text" id="spotlightText"></p>

          <p class="wish-spotlight-name" id="spotlightName"></p>

        </div>


        <!-- ชื่อคู่บ่าวสาว เหมือนบอร์ดในงานจริง -->
        <p class="tree-signature">
          AUSAMAH &amp; MIZAHASAN &nbsp;·&nbsp; 17.01.2027
        </p>

      </div>


      <!-- คงไว้ให้ JS เดิมทำงานได้ (ไม่แสดงผลแล้ว) -->
      <div
        id="wishesGrid"
        class="wishes-grid"
        hidden
      ></div>


      <div class="load-btn-wrap">

        <button
          id="reloadBtn"
          class="load-btn"
          type="button"
        >
          ↻ &nbsp; โหลดคำอวยพรใหม่
        </button>

      </div>

    </section>

  </main>

<!-- หน้าปัจจุบัน = Wishes -->
