</head>

<body>

  <!-- =========================================================
       AVATAR SPRITE
       รูปแทนตัวผู้เขียนคำอวยพร — ใช้ซ้ำได้ทั้งฟอร์มและบนต้นไม้
       เรียกด้วย <use href="#av-hiker-m"> เป็นต้น
  ========================================================== -->
  <svg
    class="av-sprite"
    aria-hidden="true"
    focusable="false"
  >

    <!-- นักเดินป่าชาย แบกเป้ -->
    <symbol id="av-hiker-m" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="5.5"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="27" y="35" width="18" height="24" rx="7" />
        <path d="M45 39c3 1 5 2 6 4" />
        <circle cx="55" cy="23" r="10" />
        <path d="M43 20h12" />
        <path d="M55 34v25" />
        <path d="M55 42l11 8" />
        <path d="M55 59l7 25" />
        <path d="M55 59l-8 24" />
      </g>
    </symbol>

    <!-- นักเดินป่าหญิง ถือไม้เท้า -->
    <symbol id="av-hiker-f" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="5.5"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="53" cy="23" r="10" />
        <path d="M62 15a7 7 0 0 1 1 10" />
        <path d="M53 34v25" />
        <path d="M53 42l-11 7" />
        <path d="M53 42l11 6" />
        <path d="M40 45L36 88" />
        <path d="M53 59l7 25" />
        <path d="M53 59l-7 24" />
      </g>
    </symbol>

    <!-- นักเดินป่าหญิง สวมฮิญาบ ถือไม้เท้า -->
    <symbol id="av-hiker-h" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="5.5"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M43 24a10 10 0 0 1 20 0c0 8-3 12-3 16h-14c0-4-3-8-3-16z" />
        <path d="M53 40v19" />
        <path d="M53 44l-11 6" />
        <path d="M53 44l11 5" />
        <path d="M40 46L36 88" />
        <path d="M53 59l7 25" />
        <path d="M53 59l-7 24" />
      </g>
    </symbol>

    <!-- ไม่ระบุ — ใช้หัวใจแทน -->
    <symbol id="av-heart" viewBox="0 0 100 100">
      <path fill="currentColor"
        d="M50 80C30 63 14 50 14 33C14 21 23 14 34 14C41 14 47 18 50 25C53 18 59 14 66 14C77 14 86 21 86 33C86 50 70 63 50 80Z" />
    </symbol>

  </svg>


  <header class="topbar">

    <!-- ฝั่งซ้ายเว้นว่าง เพราะใช้ Bottom Navigation ด้านล่างแทน -->
    <div class="header-space"></div>

    <div class="brand">

      <!--
        =====================================================
        LOGO PNG
        =====================================================
        ใส่ไฟล์โลโก้ไว้ที่:
        pic/logo.png

        ถ้าชื่อไฟล์ไม่ใช่ logo.png ให้แก้ src ด้านล่าง
      -->
      <img
        src="pic/logo.png"
        alt="Ausamah & Mizahasan Logo"
        class="brand-logo"
      >

      <h1>AUSAMAH &amp; MIZAHASAN</h1>
      <!-- <p>17-01-2027</p> -->
    </div>

    <!--<button
      class="music-btn"
      id="musicBtn"
      type="button"
      aria-label="Toggle music"
    >
      ♫
    </button> -->

  </header>


  <main>

    <section class="form-section">

      <!--
        ไอคอนโบว์ PNG
        ใส่ไฟล์ไว้ที่:
        pic/bow-icon.png
      -->
      <img
        src="pic/icon-wish.png"
        alt=""
        class="wish-icon"
      >

      <h2 class="section-title">
        LEAVE US YOUR WISHES
      </h2>

      <p class="section-subtitle">
        ฝากคำอวยพรถึงเรา 
      </p><br>

      <!--<div class="heart">
        ♥
      </div> -->


      <!--
        =========================================================
        WISH FORM

        JavaScript ของฟอร์มนี้อยู่ในไฟล์:
        assets/js/wishes.js

        ไม่ต้องใส่ API URL หรือ JavaScript ซ้ำใน wishes.html
        =========================================================
      -->

      <form
        id="wishForm"
        class="wish-form"
      >


        <div class="field">
           <img
        src="pic/icon-bow.png"
        alt=""
        class="bow-icon"
      >
          <label
            class="field-label"
            for="name"
          >
            YOUR NAME
          </label>

          <input
            id="name"
            name="name"
            type="text"
            maxlength="60"
            placeholder="ชื่อของคุณ"
            required
          >

        </div>


        <div class="field">

          <label
            class="field-label"
            for="wish"
          >
            YOUR WISHES
          </label>

          <textarea
            id="wish"
            name="wish"
            maxlength="200"
            placeholder="เขียนคำอวยพรของคุณที่นี่..."
            required
          ></textarea>

          <div class="counter">
            <span id="count">0</span>/200
          </div>

        </div>


        <!-- =====================================================
             AVATAR — รูปแทนตัวผู้เขียน
             เลือกเซลฟี่ หรือเลือกรูปนักเดินป่า
        ====================================================== -->

        <div class="field av-field">

          <span class="field-label">
            YOUR AVATAR
            <small>(ไม่บังคับ)</small>
          </span>


          <div class="av-row">

            <button
              type="button"
              class="av-choice is-selected"
              data-avatar=""
              aria-pressed="true"
              title="ไม่ระบุ"
            >
              <svg aria-hidden="true"><use href="#av-heart" /></svg>
              <span>ไม่ระบุ</span>
            </button>

            <button
              type="button"
              class="av-choice"
              data-avatar="hiker-m"
              aria-pressed="false"
              title="นักเดินป่าชาย"
            >
              <svg aria-hidden="true"><use href="#av-hiker-m" /></svg>
              <span>แบกเป้</span>
            </button>

            <button
              type="button"
              class="av-choice"
              data-avatar="hiker-f"
              aria-pressed="false"
              title="นักเดินป่าหญิง"
            >
              <svg aria-hidden="true"><use href="#av-hiker-f" /></svg>
              <span>ไม้เท้า</span>
            </button>

            <button
              type="button"
              class="av-choice"
              data-avatar="hiker-h"
              aria-pressed="false"
              title="นักเดินป่าหญิง สวมฮิญาบ"
            >
              <svg aria-hidden="true"><use href="#av-hiker-h" /></svg>
              <span>ฮิญาบ</span>
            </button>


            <label class="av-choice av-selfie" title="ใช้รูปของคุณเอง">

              <input
                id="avatarPhoto"
                type="file"
                accept="image/*"
                capture="user"
                hidden
              >

              <svg aria-hidden="true" viewBox="0 0 24 24" class="av-cam">
                <path d="M4 8h3l1.6-2h6.8L17 8h3v11H4z" />
                <circle cx="12" cy="13" r="3.6" />
              </svg>

              <span>เซลฟี่</span>

            </label>

          </div>


          <div class="av-preview" id="avPreview" hidden>
            <img id="avPreviewImg" alt="รูปแทนตัวที่เลือก">
            <button type="button" id="avClear" class="av-clear">
              เอาออก
            </button>
          </div>

        </div>



        <label class="consent-row">

          <input
            id="allowDisplay"
            name="allowDisplay"
            type="checkbox"
          >

          <span>
            อนุญาตให้แสดงคำอวยพรของคุณบนเว็บไซต์
          </span>

        </label>


        <div class="divider">

          <img
            src="pic/icon-bow.png"
            alt=""
            class="bow-icon small"
          >

        </div>


        <button
          id="submitBtn"
          class="submit-btn"
          type="submit"
        >
          ➤ &nbsp; ส่งคำอวยพร
        </button>


        <div
          id="formMessage"
          class="message"
          aria-live="polite"
        ></div>

      </form>

    </section>


    <!-- =========================================================
         WISH TREE

         คำอวยพรแต่ละข้อ = หัวใจ 1 ดวงบนกิ่งไม้
         (อ้างอิงบอร์ดต้นไม้อวยพรในงานแต่งจริง)
         ยิ่งมีคนอวยพรมาก ต้นไม้ยิ่งเต็มไปด้วยหัวใจ
         แตะที่หัวใจเพื่ออ่านคำอวยพร — กดเต็มจอเพื่อฉายในงาน
    ========================================================== -->

    <section
      class="tree-section"
      id="treeSection"
    >

      <div class="cloud-header">

        <div class="sparkle-icon">
          ✦
        </div>

        <h2>
          WISHES FROM OUR LOVED ONES
        </h2>

        <p>
          คำอวยพรจากทุกคน
        </p>

      </div>


      <!-- เวทีต้นไม้ — เป็นตัวที่ขยายเต็มจอ -->
      <div
        class="tree-stage"
        id="treeStage"
      >

        <!-- กิ่งก้านสร้างจาก JS (assets/js/wishes.js → buildTree)
             หัวใจจะไปเกาะที่ปลายกิ่งแต่ละกิ่ง -->
        <svg
          class="wish-tree"
          id="wishTree"
          viewBox="0 0 1000 720"
          preserveAspectRatio="xMidYMax meet"
          aria-hidden="true"
        >

          <g class="tree-branches" id="treeBranches"></g>

          <g class="tree-hearts" id="treeHearts"></g>

          <ellipse
            class="tree-ground"
            cx="500"
            cy="706"
            rx="150"
            ry="9"
          />

        </svg>


        <!-- ข้อความเต็มที่โผล่ตอนชี้/แตะหัวใจ -->
        <div
          class="wish-tip"
          id="wishTip"
          role="tooltip"
          aria-hidden="true"
        >
          <p class="wish-tip-text" id="wishTipText"></p>
          <p class="wish-tip-name" id="wishTipName"></p>
        </div>


        <!-- ป้ายนับ + ปุ่มเต็มจอ -->
        <div class="tree-hud">

          <span
            class="tree-count"
            id="treeCount"
          ></span>

          <button
            id="fullscreenBtn"
            class="tree-fs-btn"
            type="button"
            aria-label="แสดงเต็มจอ"
          >

            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
            </svg>

            <span class="tree-fs-label">เต็มจอ</span>

          </button>

        </div>


        <!-- คำอวยพรที่กำลังฉาย -->
        <div
          class="wish-spotlight"
          id="wishSpotlight"
          aria-live="polite"
        >

          <p class="wish-spotlight-text" id="spotlightText"></p>

          <p class="wish-spotlight-name" id="spotlightName"></p>

        </div>


        <!-- ชื่อคู่บ่าวสาว เหมือนบอร์ดในงานจริง -->
        <p class="tree-signature">
          AUSAMAH &amp; MIZAHASAN &nbsp;·&nbsp; 17.01.2027
        </p>

      </div>


      <!-- คงไว้ให้ JS เดิมทำงานได้ (ไม่แสดงผลแล้ว) -->
      <div
        id="wishesGrid"
        class="wishes-grid"
        hidden
      ></div>


      <div class="load-btn-wrap">

        <button
          id="reloadBtn"
          class="load-btn"
          type="button"
        >
          ↻ &nbsp; โหลดคำอวยพรใหม่
        </button>

      </div>

    </section>

  </main>

</body>
